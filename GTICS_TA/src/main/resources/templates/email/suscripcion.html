<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Resumen de Suscripción</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; font-family: Arial, sans-serif; color: #333;">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 0 auto;">
  <tr>
    <td style="padding: 20px;">
      <h2 style="color: #0d6efd; text-align: center;">Resumen de tu Suscripción</h2>

      <table width="100%" cellpadding="10" cellspacing="0" style="border-collapse: collapse; margin-top: 20px;">
        <tr>
          <td style="font-weight: bold;">Nombre del Gimnasio:</td>
          <td th:text="${nombreGimnasio}"></td>
        </tr>
        <tr style="background-color: #f2f2f2;">
          <td style="font-weight: bold;">Fecha de Inicio:</td>
          <td th:text="${fechaInicio}"></td>
        </tr>
        <tr>
          <td style="font-weight: bold;">Fecha de Fin:</td>
          <td th:text="${fechaFin}"></td>
        </tr>
        <tr style="background-color: #f2f2f2;">
          <td style="font-weight: bold;">Tipo de Suscripción:</td>
          <td th:text="${tipoSuscripcion}"></td>
        </tr>
        <tr>
          <td style="font-weight: bold;">Fecha de Pago:</td>
          <td th:text="${fechaPago}"></td>
        </tr>
        <tr style="background-color: #f2f2f2;">
          <td style="font-weight: bold;">Medio de Pago:</td>
          <td th:text="${medioPago}"></td>
        </tr>
        <tr>
          <td style="font-weight: bold;">Costo Total:</td>
          <td>S/.<span th:text="${costoTotal}"></span></td>
        </tr>
      </table>

      <p style="margin-top: 30px; text-align: center;">
        Gracias por confiar en nuestros servicios.
      </p>
      <p style="text-align: center;">Municipalidad de San Miguel</p>
    </td>
  </tr>
</table>
</body>
</html>
