<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Confirmación de Cuenta</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; font-family: Arial, sans-serif; color: #333333;">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 0 auto;">
  <tr>
    <td style="padding: 20px; text-align: center;">
      <h2 style="color: #0d6efd; margin-bottom: 10px;">¡Hola, <span th:text="${nombre}"></span>!</h2>
      <p style="margin: 0 0 20px 0;">Ingresa a este enlace para restablecer tu contraseña. Recuerde que este código tiene validez de una hora.</p>

      <a th:href="${url}" target="_blank"
         style="display: inline-block; background-color: #0d6efd; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold;">
        Recuperar Contraseña
      </a>

      <p style="margin-top: 30px;">Si no solicitaste esto, puedes ignorar este correo.</p>
      <p style="margin-top: 10px;">Saludos,<br><strong>Municipalidad de San Miguel</strong></p>
    </td>
  </tr>
</table>
</body>
</html>
